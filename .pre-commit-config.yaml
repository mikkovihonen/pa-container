repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo-test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: ruff
        name: ruff
        entry: uv run --project . ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
        always_run: false

      - id: ruff-format
        name: ruff-format
        entry: uv run --project . ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        always_run: false

      - id: mypy
        name: mypy
        entry: uv run --project . mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --project . --group proxy pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: format-markdown
        name: format-markdown
        entry: uv run --project . python3 scripts/format_markdown.py
        language: system
        types: [markdown]
        pass_filenames: true

      - id: pymarkdown
        name: pymarkdown
        entry: uv run --project . pymarkdown --config .pymarkdown.json scan
        language: system
        types: [markdown]
        pass_filenames: true
