schema_version: "2.0.0"
name: "sqlite-vec"
version: "0.1.9"
description: "Vector search SQLite extension with SIMD acceleration"
category: "database"
license: "MIT OR Apache-2.0"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "gcc"
        - "make"
        - "git"
        - "python3"
    env:
        SQLITE_VEC_VERSION: "v0.1.9"
        SQLITE_VEC_COMMIT: "e9f598abfa0c06b328d8fe5da9c3760cce74be10"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "test -f /usr/local/lib/sqlite/vec0.so"
