schema_version: "2.0.0"
name: "gopls"
version: "0.24.0"
description: "Official Go language server (LSP)"
category: "lsp"
license: "BSD-3-Clause"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "golang"
        - "git"
    env:
        GOPLS_VERSION: "gopls/v0.24.0"
        GOPLS_COMMIT: "1f9922d1dcc5836d5c5bcb552c8fed230f885372"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "gopls version"
    expected_output_contains: "gopls"
