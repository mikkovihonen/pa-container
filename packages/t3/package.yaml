schema_version: "3.0.0"
name: "t3"
version: "0.1.7"
description: "T3 Code server and collaborative multi-agent web interface"
category: "orchestration"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "tar"
        - "gzip"
        - "curl"
    env:
        T3_VERSION: "0.1.7"
        T3_SHA256_AMD64: "c089892bf7922e2e73c6f44a5d1ea125c99f70e378c18361cbbed2fba1920e6c"
        T3_SHA256_ARM64: "5a528e23af394cc6f359036d3cb8441fda14129d477630fc6c53e4f4a1025bc8"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

runtime:
    dependencies:
        - "node"

extension:
    entrypoint: "host.plugin:T3Plugin"

cli_flags:
    - "--t3"
    - "--t3-lan"
    - "--t3-port"
    - "--t3-advertise-host"
    - "--t3-tunnel"
    - "--t3-tunnel-domain"
    - "--t3-tunnel-quick"
    - "--t3-tunnel-runner"
    - "--t3-tunnel-keyring-account"
    - "--t3-tunnel-tailscale-mode"
    - "--t3-public-url"

verification:
    command: "t3 --version"
    expected_output_contains: "0.1.7"
