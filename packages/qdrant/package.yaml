schema_version: "2.0.0"
name: "qdrant"
version: "1.20.0"
description: "Vector similarity search engine and vector database"
category: "database"
license: "Apache-2.0"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cargo"
        - "rust"
        - "gcc"
        - "git"
        - "protobuf-compiler"
    env:
        QDRANT_VERSION: "v1.20.0"
        QDRANT_COMMIT: "222b2e44ab1c3f17e8246396ead6558e45041df7"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "qdrant --version"
    expected_output_contains: "1.20"
