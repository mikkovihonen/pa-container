schema_version: "2.1.0"
name: "virtual-desktop"
version: "2.0.0"
description: "Headless Wayland desktop (labwc), wayvnc, noVNC, and agent-desktop automation CLI"
category: "desktop"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "labwc"
        - "xorg-x11-server-Xwayland"
        - "wlr-randr"
        - "wayvnc"
        - "grim"
        - "slurp"
        - "novnc"
        - "python3-websockify"
        - "mesa-dri-drivers"
        - "mesa-libGL"
        - "mesa-libEGL"
        - "mesa-libGLES"
        - "mesa-libgbm"
        - "dejavu-sans-fonts"
        - "liberation-sans-fonts"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

mcp:
    enabled: true
    server_id: "virtual-desktop"
    transport: "stdio"
    command: "/usr/local/bin/agent-desktop"
    args: ["mcp"]

runtime:
    dependencies:
        - "python"
    devices:
        - "/dev/dri"
    env:
        DISPLAY: ":0"
        WAYLAND_DISPLAY: "wayland-0"
        XDG_RUNTIME_DIR: "/run/user/1000"
        PA_CONTAINER_DESKTOP: "true"

extension:
    commands:
        - name: "desktop"
          help: "Inspect active virtual desktop containers, noVNC web UIs, and VNC endpoints"
          handler: "cli.py:handle_desktop_command"

verification:
    command: "agent-desktop status"
    expected_output_contains: "Virtual Desktop"
