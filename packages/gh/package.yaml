schema_version: "2.0.0"
name: "gh"
version: "2.103.3"
description: "GitHub CLI, pull request workflows, and GitHub MCP server"
category: "devtools"
license: "MIT"

payload:
    type: binary_download
    platforms:
        x86_64:
            url: "https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz"
            sha256: "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d"
            extract_map:
                "gh_2.103.3_linux_amd64/bin/gh": "/usr/local/bin/gh"
        aarch64:
            url: "https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_arm64.tar.gz"
            sha256: "ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63"
            extract_map:
                "gh_2.103.3_linux_arm64/bin/gh": "/usr/local/bin/gh"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

mcp:
    enabled: true
    server_id: "github"
    transport: "stdio"
    command: "/usr/local/bin/gh"
    args: ["mcp"]
    env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GH_TOKEN}"

egress:
    allow_hosts:
        - "api.github.com"
        - "github.com"
        - "raw.githubusercontent.com"
        - "objects.githubusercontent.com"

token_replacer:
    - name: "github-token"
      hostnames:
          - "api.github.com"
          - "*.github.com"
      content_patterns:
          - field: "headers"
            header_name: "Authorization"
            regex: "token (ghp_[A-Za-z0-9_]{36})"
      replace_with:
          strategy: "static"
          value: "token [REDACTED_GH_TOKEN]"
    - name: "github-bearer"
      hostnames:
          - "api.github.com"
          - "*.github.com"
      content_patterns:
          - field: "headers"
            header_name: "Authorization"
            regex: "Bearer (gho_[A-Za-z0-9_]{36})"
      replace_with:
          strategy: "static"
          value: "Bearer [REDACTED_GH_OAUTH]"

verification:
    command: "gh --version"
    expected_output_contains: "gh version 2.103"
