schema_version: "2.0.0"
name: "tree-sitter-cli"
version: "0.27.1"
description: "Parser generator tool and incremental parsing library CLI"
category: "devtools"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cargo"
        - "rust"
        - "gcc"
        - "git"
    env:
        TREE_SITTER_VERSION: "v0.27.1"
        TREE_SITTER_COMMIT: "10eb5ac119eec9cb4267a8e035066473983f5f3a"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "tree-sitter --version"
    expected_output_contains: "0.27"
