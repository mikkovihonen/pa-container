schema_version: "2.0.0"
name: "colgrep"
version: "0.1.0"
description: "Color-highlighted ripgrep wrapper and code visualizer"
category: "search"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cargo"
        - "rust"
        - "gcc"
        - "git"
    env:
        COLGREP_VERSION: "v0.1.0"
        COLGREP_COMMIT: "c6c091d7ee14c81206bb28af90d8ff506fd0235e"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "colgrep --version"
    expected_output_contains: "0.1"
