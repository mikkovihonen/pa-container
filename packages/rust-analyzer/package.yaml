schema_version: "2.0.0"
name: "rust-analyzer"
version: "2026-11-02"
description: "Rust language server protocol (LSP) implementation"
category: "lsp"
license: "MIT OR Apache-2.0"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cargo"
        - "rust"
        - "gcc"
        - "git"
    env:
        RUST_ANALYZER_VERSION: "2026-11-02"
        RUST_ANALYZER_COMMIT: "b98172d80f0da12bbde3d6733c274e17cb6417aa"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "rust-analyzer --version"
    expected_output_contains: "rust-analyzer"
