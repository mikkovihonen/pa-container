schema_version: "3.0.0"
name: "opencode"
version: "2.2.5"
description: "OpenCode AI coding agent and developer assistant CLI"
category: "agents"
license: "MIT"

extension:
    entrypoint: "host.plugin:OpenCodePlugin"
    driver_class: "host.driver:OpenCodeDriver"

payload:
    type: binary_download
    platforms:
        x86_64:
            url: "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-2.2.5.tgz"
            sha256: "92690eee07a680d3cb760ca02ba43878de9eab1b4e5d5dfae8795518c53628f4"
            extract_map:
                "package/bin/opencode": "/usr/local/bin/opencode"
        aarch64:
            url: "https://registry.npmjs.org/@opencode/cli-linux-arm64/-/cli-linux-arm64-2.2.5.tgz"
            sha256: "f8c5a82075fede9b5b044ed6c8a6d13ad807a7e62caea1cd0a878adef49eb053"
            extract_map:
                "package/bin/opencode": "/usr/local/bin/opencode"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "opencode --version"
    expected_output_contains: "2.2.5"
