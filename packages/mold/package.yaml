schema_version: "2.0.0"
name: "mold"
version: "3.0.0"
description: "High-performance drop-in modern linker"
category: "devtools"
license: "AGPL-3.0 OR MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cmake"
        - "ninja-build"
        - "gcc-c++"
        - "git"
        - "zlib-devel"
        - "openssl-devel"
    env:
        MOLD_VERSION: "v3.0.0"
        MOLD_COMMIT: "8de38c35a2df16a25f7ff87ac3ad07156a925beb"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "mold --version"
    expected_output_contains: "mold 3.0"
