schema_version: "2.0.0"
name: "ast-grep"
version: "0.51.1"
description: "Fast and polyglot tool for code searching, linting, and rewriting"
category: "search"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "cargo"
        - "rust"
        - "gcc"
        - "git"
    env:
        AST_GREP_VERSION: "0.51.1"
        AST_GREP_COMMIT: "5a204b1ef3facef94de125d990dddc7cf90011c0"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "ast-grep --version"
    expected_output_contains: "0.51"
