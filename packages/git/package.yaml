schema_version: "3.0.0"
name: "git"
version: "2.56.0"
description: "Fast, scalable, distributed revision control system and Git MCP server"
category: "scm"
license: "GPL-2.0"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "gcc"
        - "make"
        - "diffutils"
        - "curl-devel"
        - "expat-devel"
        - "gettext"
        - "openssl-devel"
        - "zlib-devel"
    build_packages:
        - "python"
    env:
        GIT_VERSION: "2.56.0"
        GIT_SHA256: "26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3"

mcp:
    enabled: true
    server_id: "git"
    transport: "stdio"
    command: "/usr/local/bin/mcp-server-git"
    args: []

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

runtime:
    dependencies:
        - "python"

extension:
    entrypoint: "host.plugin:GitPlugin"
    config_key: "git"

verification:
    command: "git --version && mcp-server-git --help"
    expected_output_contains: "git version 2.56"
