schema_version: "2.0.0"
name: "glab"
version: "1.128.0"
description: "GitLab CLI tool bringing GitLab to your command line"
category: "devtools"
license: "MIT"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "curl"
        - "tar"
    env:
        GLAB_VERSION: "1.128.0"
        GLAB_SHA256_AMD64: "bc024819e7598b19429a199cd87f640d98b2b67416d8ad796f19e4260b57a7c7"
        GLAB_SHA256_ARM64: "60d0512085a8c1be7c5ef51aa7e4ee28213444cea0376b3260707d90489199ea"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "glab --version"
    expected_output_contains: "glab version 1.128"
