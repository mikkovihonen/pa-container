# Self-Hosted Penpot Stack for PA-Container 2.0 Design System
# Default Web UI: http://127.0.0.1:9001
# Default Exporter: http://penpot-exporter:6061

services:
  penpot-frontend:
    image: penpotapp/frontend:latest
    container_name: pa-penpot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:8080"
    environment:
      - PENPOT_FLAGS=enable-access-tokens disable-telemetry
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter

  penpot-backend:
    image: penpotapp/backend:latest
    container_name: pa-penpot-backend
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      - PENPOT_FLAGS=enable-access-tokens disable-telemetry
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY:-pa-penpot-secret-key-change-in-production}
      - PENPOT_DATABASE_URI=postgresql://penpot:${PENPOT_DB_PASSWORD:-penpot}@penpot-postgres/penpot
      - PENPOT_REDIS_URI=redis://penpot-valkey/0
      - PENPOT_EXPORTER_URI=http://penpot-exporter:6061
      - PENPOT_PUBLIC_URI=http://127.0.0.1:9001
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy

  penpot-exporter:
    image: penpotapp/exporter:latest
    container_name: pa-penpot-exporter
    restart: unless-stopped
    environment:
      - PENPOT_PUBLIC_URI=http://127.0.0.1:9001
      - PENPOT_REDIS_URI=redis://penpot-valkey/0
    depends_on:
      penpot-valkey:
        condition: service_healthy

  penpot-postgres:
    image: postgres:16-alpine
    container_name: pa-penpot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${PENPOT_DB_PASSWORD:-penpot}
      - POSTGRES_DB=penpot
    volumes:
      - penpot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 5s
      timeout: 5s
      retries: 5

  penpot-valkey:
    image: valkey/valkey:8-alpine
    container_name: pa-penpot-valkey
    restart: unless-stopped
    volumes:
      - penpot_valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  penpot_assets:
  penpot_pgdata:
  penpot_valkeydata:
