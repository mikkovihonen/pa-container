# Global pa-container configuration (~/.config/pa-container/config.yaml)
# Seeded automatically on first run; edit to customize host-wide defaults.
schema_version: "0.6.6"

# Host container runtime and orchestration logging
runtime:
  log_level: INFO
  bridge_interface: null
  proxy_upstream_network: podman
  open_browser: false

# Host LLaMA inference engine settings
llama:
  # Path to llama-server. If null or omitted, pa-container resolves:
  # 1. ~/.cache/pa-container/bin/llama-server (built via ./build.sh --llama)
  # 2. Host PATH (e.g. /opt/homebrew/bin/llama-server or distro package)
  bin: null

  # Source build settings (used by ./build.sh --llama)
  build:
    repo: "https://github.com/ggml-org/llama.cpp.git"
    tag: "v0.9.0"
    backend: auto  # auto, metal, cuda, rocm, cpu
    minimal: true  # Minimal headless server: strips WebUI, libcurl, SSL, and examples
    cmake_flags: []

# Container image build preferences
build:
  images:
    agent: pa-container-agent:local
    proxy: pa-container-agent-proxy:local
    builder: pa-container-agent-builder:local
  dns: "1.1.1.1"
  python_optimize: true
  memory_preflight: true
  node_source: prebuilt
  prune_dangling: true
  purge_build_cache: false

# Logging configuration and retention
logging:
  log_level: INFO
  retention:
    max_days: 14       # Delete logs older than N days (null = no age limit)
    max_launches: 10   # Keep the latest N launch logs (null = no count limit)

# Virtual desktop preferences
desktop:
  open_browser: false

