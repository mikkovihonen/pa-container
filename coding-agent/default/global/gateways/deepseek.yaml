id: deepseek
description: "DeepSeek API Gateway"
baseUrl: "https://api.deepseek.com/v1"
type: openai-compat

auth:
  type: api-key

allowlist:
  - name: "deepseek-api-allow"
    mode: "allow"
    hostnames:
      - "api.deepseek.com"
    ip_ranges: []

token_replacer:
  - name: "DeepSeek Bearer Token Injection"
    hostnames:
      - "api.deepseek.com"
    content_patterns:
      - field: "headers"
        header_name: "Authorization"
        regex: "(?<=Bearer\\s)DEEPSEEK_API_KEY_PLACEHOLDER"
    replace_with:
      strategy: "static"
      value: "${ENV:containerEnvVar}"
