[workspace]
resolver = "2"
members = [
    "crates/pa-core",
    "crates/pa-cli",
    "crates/pa-agentd",
    "crates/pa-landlock",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["PA-Container Authors"]
license = "MIT"
repository = "https://github.com/mikkovihonen/pa-container"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "cargo"] }
tempfile = "3.14"
anyhow = "1.0"
thiserror = "1.0"
