[workspace]
resolver = "2"
members = [
    "crates/pa-core",
    "crates/pa-cli",
    "crates/pa-agentd",
    "crates/pa-landlock",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["PA-Container Authors"]
license = "MIT"
repository = "https://github.com/mikkovihonen/pa-container"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4.5", features = ["derive", "cargo"] }
tempfile = "3.14"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hmac = "0.12"
nix = { version = "0.29", features = ["user", "process", "fs"] }
libc = "0.2"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
