[project]
site_name = "pa-container"
site_description = "Next-Generation Multi-Agent Software Factory with MicroVM Isolation and Network Auditing"
site_url = "https://mikkovihonen.github.io/pa-container"

repo_name = "mikkovihonen/pa-container"
repo_url = "https://github.com/mikkovihonen/pa-container"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Feature Workflow" = "features.md" },
  { "Multi-Agent Support" = "agents.md" },
  { "Sandboxing 101" = "sandboxing.md" },
  { "4-Layer Provenance" = [
    { "Overview & Model" = "provenance/index.md" },
    { "OKRs-as-Code (Layer 0)" = "provenance/okrs.md" },
    { "Specs & Traceability (Layer 1)" = "provenance/traceability.md" },
    { "Design System & Tokens (Layer 1)" = "provenance/design-system.md" },
    { "Runtime Telemetry & Git (Layer 2)" = "provenance/telemetry.md" },
    { "Closed-Loop Governance (Layer 3)" = "provenance/governance.md" },
    { "Factory DBOM & Attestation" = "provenance/bom.md" },
  ] },
  { "Proxy & Addons" = [
    { "Overview" = "proxy/overview.md" },
    { "Allowlist" = "proxy/allowlist.md" },
    { "Token Replacer" = "proxy/token-replacer.md" },
    { "Flow Export" = "proxy/flow-export.md" },
    { "OTLP Exporter" = "proxy/otlp-exporter.md" },
    { "Addon Development" = "proxy/addon-development.md" },
  ] },
  { "Configuration Reference" = "configuration.md" },
  { "Architecture Plan" = "design/pa_container_next_generation_software_factory_architecture_plan.md" },
  { "Platform Parity" = "platform-parity.md" },
  { "T3 Code Integration" = "t3-code.md" },
  { "Development" = "development.md" },
  { "Releases" = "releases.md" },
]

[project.theme]
language = "en"
logo = "assets/pa-container-logo.svg"
favicon = "assets/png/pa-container-32.png"
custom_dir = "docs/overrides"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

