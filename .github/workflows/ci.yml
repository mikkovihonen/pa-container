name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run E2E lifecycle tests
        run: |
          export PA_TEST_MODE=1
          export PA_DISABLE_KEYRING=1
          for t in tests/e2e/test_*.sh; do
            echo "==> Running $t"
            bash "$t"
          done

  proxy-and-docs:
    name: Proxy & Docs Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --project .

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy
        run: uv run mypy

      - name: Run proxy and MCP tests
        run: uv run pytest

      - name: Validate version consistency
        run: uv run python3 .github/workflows/scripts/validate_versions.py

      - name: Scan markdown documentation
        run: uv run pymarkdown --config .pymarkdown.json scan

      - name: Build documentation site
        run: uv run zensical build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [rust-check, proxy-and-docs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        run: |
          awk -v v="${{ steps.version.outputs.VERSION }}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { p = 1; next }
            p && /^## / { exit }
            p
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::No '## [${{ steps.version.outputs.VERSION }}]' section in CHANGELOG.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
