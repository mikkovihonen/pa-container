schema_version: "0.7.0"
name: "source-control/cafe"
version: "1.0.0"
description: "GitCafe CLI tool and git assistant with embedded Bun runtime"
category: "scm"
license: "MIT"

config:
    auto_detect_host_cli: false

secrets:
    - name: "gitcafe"
      required: true
      placeholder: "GITCAFE_TOKEN_PLACEHOLDER"

payload:
    type: "build_script"
    script: "build.sh"
    build_deps:
        - "curl"
        - "unzip"
        - "tar"
    env:
        CAFE_VERSION: "0.13.0"
        CAFE_SHA256: "17d5cb6d72b9db84e1e44043d02f8a7e8212304a2e7fea20ace89b863aec3460"
        BUN_VERSION: "1.4.4"
        BUN_SHA256_AMD64: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
        BUN_SHA256_ARM64: "baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e"

runtime:
    dependencies:
        - "source-control/base"

egress:
    allow_hosts:
        - "gitcafe.com"
        - "*.gitcafe.com"

token_replacer:
    - name: "gitcafe-token-inject"
      hostnames:
          - "gitcafe.com"
          - "*.gitcafe.com"
      content_patterns:
          - field: "headers"
            header_name: "Authorization"
            regex: "GITCAFE_TOKEN_PLACEHOLDER"
          - field: "headers"
            header_name: "Authorization"
            encoding: "base64"
            regex: "GITCAFE_TOKEN_PLACEHOLDER"
      replace_with:
          strategy: "static"
          value: "${ENV:GITCAFE_TOKEN}"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "cafe --version"
