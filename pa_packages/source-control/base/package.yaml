schema_version: "0.7.0"
name: "source-control/base"
version: "1.0.0"
description: "Unified source control management base setup, entrypoints, and credential scaffolding"
category: "scm"
license: "MIT"

payload:
    type: "build_script"
    script: "build.sh"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "test -d /usr/local/share/pa-container/entrypoint.d/agent"
