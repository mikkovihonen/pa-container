schema_version: "0.7.0"
name: "source-control/github"
version: "1.0.0"
description: "GitHub CLI (gh), pull request workflows, and GitHub MCP server"
category: "scm"
license: "MIT"

config:
    auto_detect_host_cli: false

secrets:
    - name: "github"
      required: true
      placeholder: "GH_TOKEN_PLACEHOLDER"

payload:
    type: "build_script"
    script: "build.sh"
    build_deps:
        - "curl"
        - "tar"
    env:
        GH_VERSION: "2.103.3"
        GH_SHA256_AMD64: "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d"
        GH_SHA256_ARM64: "ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63"

runtime:
    dependencies:
        - "source-control/base"

mcp:
    enabled: true
    server_id: "github"
    transport: "stdio"
    command: "/usr/local/bin/gh"
    args: ["mcp"]
    env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GH_TOKEN}"

egress:
    allow_hosts:
        - "api.github.com"
        - "github.com"
        - "raw.githubusercontent.com"
        - "objects.githubusercontent.com"

token_replacer:
    - name: "github-token-inject"
      hostnames:
          - "api.github.com"
          - "github.com"
          - "*.github.com"
          - "raw.githubusercontent.com"
          - "objects.githubusercontent.com"
      content_patterns:
          - field: "headers"
            header_name: "Authorization"
            regex: "GH_TOKEN_PLACEHOLDER"
          - field: "headers"
            header_name: "Authorization"
            encoding: "base64"
            regex: "GH_TOKEN_PLACEHOLDER"
      replace_with:
          strategy: "static"
          value: "${ENV:GH_TOKEN}"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "gh --version"
    expected_output_contains: "gh version 2.103"
