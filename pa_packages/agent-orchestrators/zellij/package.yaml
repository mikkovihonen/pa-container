schema_version: "0.7.0"
name: "agent-orchestrators/zellij"
version: "0.44.0"
description: "Zellij multiplayer terminal workspace and built-in authenticated web server ('zellij web') with independent multi-user cursors and session tokens"
category: "orchestration"
license: "MIT"

payload:
    type: binary_download
    platforms:
        x86_64:
            url: "https://github.com/zellij-org/zellij/releases/download/v0.44.0/zellij-x86_64-unknown-linux-musl.tar.gz"
            sha256: "7e981d50c98ec13ad6cc882e8ca4da32544dd6b69fd0d1b2b753eb597847adb3"
            extract_map:
                "zellij": "/usr/local/bin/zellij"
        aarch64:
            url: "https://github.com/zellij-org/zellij/releases/download/v0.44.0/zellij-aarch64-unknown-linux-musl.tar.gz"
            sha256: "dd60edef434b413529060ba46135c7ed2e4d41c92d640ce51558df031875bb2c"
            extract_map:
                "zellij": "/usr/local/bin/zellij"

runtime:
    dependencies:
        - "agent-orchestrators/base"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "zellij --version"
    expected_output_contains: "zellij"
