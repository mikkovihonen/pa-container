schema_version: "0.7.0"
name: "reverse-engineering"
version: "1.0.0"
description: "Reverse engineering and binary analysis suite: Ghidra (headless/GUI), Capstone/Unicorn/Keystone, binary triage utilities, and MCP server"
category: "security"
license: "Apache-2.0"

payload:
    type: "none"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

runtime:
    dependencies:
        - "reverse-engineering/base"
        - "reverse-engineering/ghidra-headless"
        - "reverse-engineering/emulation"

verification:
    command: "file --version && readelf -v"
    expected_output_contains: "readelf"
