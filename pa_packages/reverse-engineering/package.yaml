schema_version: "0.7.0"
name: "reverse-engineering"
version: "1.0.0"
description: "Reverse engineering and binary analysis suite: Ghidra (headless/GUI), Capstone/Unicorn/Keystone, binary triage utilities, and MCP server"
category: "security"
license: "Apache-2.0"

payload:
    type: "build_script"
    script: "build.sh"
    packages:
        - "file"
        - "binutils"
        - "patchelf"
        - "strace"
        - "ltrace"
        - "binwalk"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

features:
    ghidra-headless:
        description: "Ghidra batch analysis engine (analyzeHeadless) with OpenJDK 21 headless runtime and decompilation helpers"
        default: true
        payload:
            type: "build_script"
            script: "features/ghidra-headless/build.sh"
            build_deps:
                - "curl"
                - "unzip"
            packages:
                - "java-21-openjdk-headless"
            env:
                GHIDRA_VERSION: "12.2"
                GHIDRA_BUILD_DATE: "20261016"
                GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
        runtime:
            env:
                GHIDRA_INSTALL_DIR: "/usr/local/share/ghidra"
                JAVA_HOME: "/usr/lib/jvm/jre-21-openjdk"
        skill_fragment: "features/ghidra-headless/skill/SKILL.md"
        verification:
            command: "ghidra-headless -help 2>&1 | grep -q 'analyzeHeadless' && echo ghidra-headless-ready"
            expected_output_contains: "ghidra-headless-ready"

    ghidra:
        description: "Ghidra interactive GUI application with desktop launcher"
        default: false
        payload:
            type: "build_script"
            script: "features/ghidra/build.sh"
            build_deps:
                - "curl"
                - "unzip"
            packages:
                - "java-21-openjdk"
                - "dejavu-sans-fonts"
                - "liberation-sans-fonts"
            env:
                GHIDRA_VERSION: "12.2"
                GHIDRA_BUILD_DATE: "20261016"
                GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
        runtime:
            dependencies:
                - "virtual-desktop"
            env:
                GHIDRA_INSTALL_DIR: "/usr/local/share/ghidra"
                JAVA_HOME: "/usr/lib/jvm/jre-21-openjdk"
        skill_fragment: "features/ghidra/skill/SKILL.md"
        verification:
            command: "test -x /usr/local/bin/ghidra && test -f /usr/share/applications/ghidra.desktop && echo ghidra-gui-ready"
            expected_output_contains: "ghidra-gui-ready"

    emulation:
        description: "Capstone (disassembly), Unicorn (CPU emulation), and Keystone (assembly) frameworks with Python bindings"
        default: true
        payload:
            type: "build_script"
            script: "features/emulation/build.sh"
            build_packages:
                - "python"
            packages:
                - "capstone"
                - "python3-capstone"
        runtime:
            dependencies:
                - "python"
        skill_fragment: "features/emulation/skill/SKILL.md"
        verification:
            command: "python3 -c 'import capstone; print(\"capstone-ok\")'"
            expected_output_contains: "capstone-ok"

    mcp:
        description: "Reverse engineering Model Context Protocol (MCP) server for structured binary analysis and decompilation"
        default: false
        payload:
            type: "build_script"
            script: "features/mcp/build.sh"
            build_packages:
                - "python"
        runtime:
            dependencies:
                - "python"
        mcp:
            enabled: true
            server_id: "reverse-engineering"
            transport: "stdio"
            command: "/usr/local/bin/re-mcp-server"
            args: []
        skill_fragment: "features/mcp/skill/SKILL.md"
        verification:
            command: "re-mcp-server --self-test"
            expected_output_contains: "mcp-server-ready"

verification:
    command: "file --version && readelf -v"
    expected_output_contains: "readelf"
