schema_version: "0.7.0"
name: "git"
version: "2.47.1"
description: "Fast, scalable, distributed revision control system and optional Git MCP server"
category: "scm"
license: "GPL-2.0"

config:
    safe_directory: true
    rewrite_ssh_to_https: true

payload:
    type: distro_package
    packages:
        - "git"

features:
    mcp:
        description: "Git Model Context Protocol (MCP) server for repository inspection and operations"
        default: false
        payload:
            type: build_script
            script: "features/mcp/build.sh"
            build_deps:
                - "python3-pip"
            build_packages:
                - "python"
        mcp:
            enabled: true
            server_id: "git"
            transport: "stdio"
            command: "/usr/local/bin/mcp-server-git"
            args: []
        runtime:
            dependencies:
                - "python"
        skill_fragment: "features/mcp/skill/SKILL.md"
        verification:
            command: "mcp-server-git --help"
            expected_output_contains: "mcp-server-git"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

extension:
    entrypoint: "host.plugin:GitPlugin"
    config_key: "git"

verification:
    command: "git --version"
    expected_output_contains: "git version"
