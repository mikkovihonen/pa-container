schema_version: "0.7.0"
name: "git"
version: "2.47.1"
description: "Fast, scalable, distributed revision control system and optional Git MCP server"
category: "scm"
license: "GPL-2.0"

config:
    safe_directory: true
    rewrite_ssh_to_https: true

payload:
    type: "none"

extension:
    entrypoint: "host.plugin:GitPlugin"
    config_key: "git"

runtime:
    dependencies:
        - "git/base"

verification:
    command: "git --version"
    expected_output_contains: "git version"
