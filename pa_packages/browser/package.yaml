schema_version: "0.7.0"
name: "browser"
version: "2.0.0"
description: "Web browser automation: Chromium on a virtual desktop, shared headless runtime libraries, and Playwright MCP"
category: "browser"
license: "BSD-3-Clause"

payload:
    type: "none"

skill:
    enabled: true
    source: "skill/base.md"
    target_agents: ["all"]

features:
    required: true
    chromium:
        description: "Chrome for Testing browser engine with Playwright MCP server and interactive GUI use on the virtual desktop"
        default: false
        payload:
            type: "build_script"
            script: "features/chromium/build.sh"
            build_deps:
                - "unzip"
                - "curl"
            build_packages:
                - "node"
            # Shared runtime libraries installed into the TARGET image as distro
            # packages (collect_distro_packages). GUI Chromium needs the same
            # libraries as headless Chromium.
            packages:
                - "alsa-lib"
                - "at-spi2-atk"
                - "at-spi2-core"
                - "atk"
                - "cairo"
                - "cups-libs"
                - "dbus-libs"
                - "libX11"
                - "libXcomposite"
                - "libXdamage"
                - "libXext"
                - "libXfixes"
                - "libXrandr"
                - "libxkbcommon"
                - "mesa-libgbm"
                - "nspr"
                - "nss"
                - "pango"
            env:
                CHROMIUM_VERSION: "157.0.8103.38"
                CHROMIUM_SHA256_AMD64: "8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66"
                CHROMIUM_SHA256_ARM64: "5517510e61657ff43ee9ab804ecd1a499b3d5bd3caf72f097516bd6565ba5a17"
                PLAYWRIGHT_MCP_VERSION: "0.0.85"
        runtime:
            dependencies:
                - "node"
                - "virtual-desktop"
            devices:
                - "/dev/dri"
            env:
                CHROME_DEVEL_SANDBOX: "/usr/local/lib/chromium/chrome-sandbox"
        mcp:
            enabled: true
            server_id: "playwright"
            transport: "stdio"
            command: "/usr/local/bin/playwright-mcp"
            args: []
        skill_fragment: "features/chromium/skill/SKILL.md"
        verification:
            command: "chromium --version && playwright-mcp --version"
            expected_output_contains: "Chrome for Testing"

    chromium-headless:
        description: "Shared runtime libraries for headless Chromium, Playwright, and Puppeteer"
        default: true
        payload:
            # Runtime libraries installed into the TARGET image as distro packages
            # (collect_distro_packages). Never hand-stage these from the build stage.
            type: "distro_package"
            packages:
                - "alsa-lib"
                - "at-spi2-atk"
                - "at-spi2-core"
                - "atk"
                - "cairo"
                - "cups-libs"
                - "dbus-libs"
                - "libX11"
                - "libXcomposite"
                - "libXdamage"
                - "libXext"
                - "libXfixes"
                - "libXrandr"
                - "libxkbcommon"
                - "mesa-libgbm"
                - "nspr"
                - "nss"
                - "pango"
        skill_fragment: "features/chromium-headless/skill/SKILL.md"
        verification:
            command: "test -f /usr/lib64/libcairo.so.2 && test -f /usr/lib64/libpango-1.0.so.0"

verification:
    command: "test -d /usr/local/share/pa-container/packages/browser"
