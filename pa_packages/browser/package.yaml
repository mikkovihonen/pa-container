schema_version: "0.7.0"
name: "browser"
version: "2.0.0"
description: "Web browser automation: Chromium on a virtual desktop, shared headless runtime libraries, and Playwright MCP"
category: "browser"
license: "BSD-3-Clause"

payload:
    type: "none"

skill:
    enabled: true
    source: "skill/base.md"
    target_agents: ["all"]

runtime:
    dependencies:
        - "browser/chromium-headless"

verification:
    command: "test -f /usr/lib64/libcairo.so.2 && test -f /usr/lib64/libpango-1.0.so.0"
