schema_version: "0.7.0"
name: "browser/chromium-headless"
version: "2.0.0"
description: "Shared runtime libraries for headless Chromium, Playwright, and Puppeteer"
category: "browser"
license: "BSD-3-Clause"

payload:
    type: "distro_package"
    packages:
        - "alsa-lib"
        - "at-spi2-atk"
        - "at-spi2-core"
        - "atk"
        - "cairo"
        - "cups-libs"
        - "dbus-libs"
        - "libX11"
        - "libXcomposite"
        - "libXdamage"
        - "libXext"
        - "libXfixes"
        - "libXrandr"
        - "libxkbcommon"
        - "mesa-libgbm"
        - "nspr"
        - "nss"
        - "pango"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

verification:
    command: "test -f /usr/lib64/libcairo.so.2 && test -f /usr/lib64/libpango-1.0.so.0"
