schema_version = "1.0"

[capability]
name = "agents"
category = "agents"
version = "1.0.0"
description = "Unified AI coding agents runtime capability (Pi, OpenCode, Claude Code, and Google Antigravity)"
requires = []

[staging]
install_prefix = "/opt/pa/packs/agents"
bin_dirs = ["bin"]
fedora_packages = ["tmux", "zellij", "git"]
macos_brew_packages = ["tmux", "zellij", "git"]

[entitlements]
read_paths = ["/opt/pa/packs/agents"]
write_paths = ["/tmp/pa-agents"]
allow_gpu = true

[proxy]
allowlist = ["api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com"]
tokens = []
