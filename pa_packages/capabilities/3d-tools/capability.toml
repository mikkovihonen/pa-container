schema_version = "1.0"

[capability]
name = "3d-tools"
category = "media"
version = "1.0.0"
description = "3D model inspection, format conversion, and mesh topology repair using Assimp and ADMesh"
requires = []

[staging]
install_prefix = "/opt/pa/packs/3d-tools"
bin_dirs = ["bin"]
fedora_packages = ["assimp", "admesh"]
macos_brew_packages = ["assimp", "admesh"]

[entitlements]
read_paths = ["/opt/pa/packs/3d-tools"]
write_paths = ["/tmp/pa-3d"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
