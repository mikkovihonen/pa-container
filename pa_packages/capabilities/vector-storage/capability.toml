schema_version = "1.0"

[capability]
name = "vector-storage"
category = "database"
version = "1.0.0"
description = "Embedded vector storage and SIMD vector search extensions: sqlite-vec, USearch, and optional Qdrant daemon"
requires = []

[staging]
install_prefix = "/opt/pa/packs/vector-storage"
bin_dirs = ["bin"]
fedora_packages = ["sqlite", "sqlite-devel"]
macos_brew_packages = ["sqlite"]

[entitlements]
read_paths = ["/opt/pa/packs/vector-storage"]
write_paths = ["/tmp/pa-vector"]
allow_gpu = true

[proxy]
allowlist = []
tokens = []
