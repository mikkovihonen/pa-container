schema_version = "1.0"

[capability]
name = "sound-tools"
category = "media"
version = "1.0.0"
description = "Audio processing capability: SoX effects, spectrograms, FAAD2 AAC/M4A decode, FLAC/Ogg/Opus codecs, LAME/twolame MP3"
requires = []

[staging]
install_prefix = "/opt/pa/packs/sound-tools"
bin_dirs = ["bin"]
fedora_packages = ["sox", "faad2", "flac", "opus-tools"]
macos_brew_packages = ["sox", "faad2", "flac", "opus-tools"]

[entitlements]
read_paths = ["/opt/pa/packs/sound-tools"]
write_paths = ["/tmp/pa-media"]
allow_gpu = false

[proxy]
allowlist = ["api.openai.com"]

[[proxy.tokens]]
env_var = "OPENAI_API_KEY"
allowed_hosts = ["api.openai.com"]
