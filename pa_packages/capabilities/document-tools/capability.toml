schema_version = "1.0"

[capability]
name = "document-tools"
category = "devtools"
version = "1.0.0"
description = "Document conversion and extraction: Pandoc (universal document converter) and Poppler utilities (PDF text/image extraction)"
requires = []

[staging]
install_prefix = "/opt/pa/packs/document-tools"
bin_dirs = ["bin"]
fedora_packages = ["pandoc", "poppler-utils"]
macos_brew_packages = ["pandoc", "poppler"]

[entitlements]
read_paths = ["/opt/pa/packs/document-tools"]
write_paths = ["/tmp/pa-docs"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
