schema_version = "1.0"

[capability]
name = "ios-simulator"
category = "mobile"
version = "1.0.0"
description = "Hardware-accelerated iOS Simulator runtime and observation on Apple Silicon (Xcode, Metal, xcrun simctl)"
requires = []

[staging]
install_prefix = "/opt/pa/packs/ios-simulator"
bin_dirs = ["bin"]
fedora_packages = []
macos_brew_packages = []

[entitlements]
read_paths = ["/Applications/Xcode.app", "/Library/Developer"]
write_paths = ["/tmp/pa-ios", "/private/var/folders"]
allow_gpu = true

[proxy]
allowlist = []
tokens = []
