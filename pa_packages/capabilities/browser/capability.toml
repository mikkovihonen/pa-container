schema_version = "1.0"

[capability]
name = "browser"
category = "browser"
version = "1.0.0"
description = "Web browser automation and testing: Playwright, Puppeteer, and Chromium headless page rendering, DOM inspection, and screenshot capture"
requires = []

[staging]
install_prefix = "/opt/pa/packs/browser"
bin_dirs = ["bin"]
fedora_packages = ["chromium", "nss", "atk", "cups-libs", "gtk3", "libXcomposite"]
macos_brew_packages = []

[entitlements]
read_paths = ["/opt/pa/browsers"]
write_paths = ["/tmp/pa-browser"]
allow_gpu = false

[env]
PLAYWRIGHT_BROWSERS_PATH = "/tmp/pa-browsers"

[proxy]
allowlist = []
tokens = []
