schema_version = "1.0"

[capability]
name = "virtual-desktop"
category = "desktop"
version = "1.0.0"
description = "Headless virtual desktop and graphical application inspection: Wayland/X11 on Linux and native Quartz/Metal display automation on macOS"
requires = []

[staging]
install_prefix = "/opt/pa/packs/virtual-desktop"
bin_dirs = ["bin"]
fedora_packages = ["labwc", "wayvnc", "xorg-x11-server-Xvfb", "x11vnc", "xdotool", "grim"]
macos_brew_packages = ["cliclick"]

[entitlements]
read_paths = ["/opt/pa/packs/virtual-desktop"]
write_paths = ["/tmp/pa-desktop", "/tmp/.X11-unix"]
allow_gpu = true
allow_network_bind = [5900, 6080]

[env]
DISPLAY = ":0"
WAYLAND_DISPLAY = "wayland-0"

[proxy]
allowlist = []
tokens = []
