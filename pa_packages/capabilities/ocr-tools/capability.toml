schema_version = "1.0"

[capability]
name = "ocr-tools"
category = "media"
version = "1.0.0"
description = "Optical Character Recognition (OCR) capability: Tesseract CLI text extraction, language models, and OCRmyPDF searchable PDF generation"
requires = ["image-tools"]

[staging]
install_prefix = "/opt/pa/packs/ocr-tools"
bin_dirs = ["bin"]
fedora_packages = ["tesseract", "tesseract-osd", "tesseract-langpack-eng", "ocrmypdf"]
macos_brew_packages = ["tesseract", "tesseract-lang", "ocrmypdf"]

[entitlements]
read_paths = ["/opt/pa/packs/ocr-tools", "/usr/share/tesseract", "/opt/homebrew/share/tessdata"]
write_paths = ["/tmp/pa-media"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
