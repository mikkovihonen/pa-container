schema_version = "1.0"

[capability]
name = "az"
category = "cloud"
version = "1.0.0"
description = "Azure CLI and Azure DevOps extension"
requires = ["languages"]

[staging]
install_prefix = "/opt/pa/packs/az"
bin_dirs = ["bin"]
fedora_packages = ["azure-cli"]
macos_brew_packages = ["azure-cli"]

[entitlements]
read_paths = ["/opt/pa/packs/az"]
write_paths = ["/tmp/pa-az"]
allow_gpu = false

[proxy]
allowlist = ["management.azure.com", "login.microsoftonline.com", "dev.azure.com"]
tokens = []
