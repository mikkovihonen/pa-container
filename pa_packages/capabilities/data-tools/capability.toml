schema_version = "1.0"

[capability]
name = "data-tools"
category = "devtools"
version = "1.0.0"
description = "Structured data processing capability: jq (JSON), yq (YAML/XML), and Miller mlr (CSV/TSV/JSON)"
requires = []

[staging]
install_prefix = "/opt/pa/packs/data-tools"
bin_dirs = ["bin"]
fedora_packages = ["jq", "yq", "miller"]
macos_brew_packages = ["jq", "yq", "miller"]

[entitlements]
read_paths = ["/opt/pa/packs/data-tools"]
write_paths = ["/tmp/pa-data"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
