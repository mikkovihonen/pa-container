schema_version = "1.0"

[capability]
name = "image-tools"
category = "media"
version = "1.0.0"
description = "Image processing capability: ImageMagick conversion and effects, ExifTool/exiv2 metadata, WebP/JPEG/TIFF/PNG codec utilities"
requires = []

[staging]
install_prefix = "/opt/pa/packs/image-tools"
bin_dirs = ["bin"]
fedora_packages = ["ImageMagick", "libwebp-tools", "oxipng", "perl-Image-ExifTool", "potrace"]
macos_brew_packages = ["imagemagick", "webp", "oxipng", "exiftool", "potrace"]

[entitlements]
read_paths = ["/opt/pa/packs/image-tools"]
write_paths = ["/tmp/pa-media"]
allow_gpu = false

[env]
MAGICK_TEMPORARY_PATH = "/tmp/pa-media"

[proxy]
allowlist = ["api.openai.com", "generativelanguage.googleapis.com", "api.stability.ai"]

[[proxy.tokens]]
env_var = "OPENAI_API_KEY"
allowed_hosts = ["api.openai.com"]

[[proxy.tokens]]
env_var = "STABILITY_API_KEY"
allowed_hosts = ["api.stability.ai"]
