schema_version = "1.0"

[capability]
name = "reverse-engineering"
category = "security"
version = "1.0.0"
description = "Reverse engineering and firmware/binary analysis suite: Ghidra headless decompiler, OpenJDK 21, radare2, and MCP analysis tools"
requires = []

[staging]
install_prefix = "/opt/pa/packs/reverse-engineering"
bin_dirs = ["bin"]
fedora_packages = ["java-21-openjdk-headless", "radare2", "binutils", "file"]
macos_brew_packages = ["openjdk@21", "radare2", "binutils"]

[entitlements]
read_paths = ["/opt/pa/packs/reverse-engineering"]
write_paths = ["/tmp/pa-re"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
