schema_version = "1.0"

[capability]
name = "reverse-engineering"
category = "security"
version = "1.0.0"
description = "Reverse engineering and binary analysis suite (radare2, binutils)"
requires = []

[staging]
install_prefix = "/opt/pa/packs/reverse-engineering"
bin_dirs = ["bin"]
fedora_packages = ["radare2", "binutils"]
macos_brew_packages = ["radare2", "binutils"]

[entitlements]
read_paths = ["/opt/pa/packs/reverse-engineering"]
write_paths = ["/tmp/pa-re"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
