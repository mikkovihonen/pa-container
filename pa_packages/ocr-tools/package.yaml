schema_version: 0.7.0
name: ocr-tools
version: 1.0.0
description: 'OCR capability: tesseract text extraction from images and scanned pages,
  English baseline data, and optional ocrmypdf and language packs'
category: media
license: Apache-2.0 AND MPL-2.0 AND AGPL-3.0-or-later
payload:
  type: none
skill:
  enabled: true
