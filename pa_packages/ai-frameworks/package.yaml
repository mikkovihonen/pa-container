schema_version: "0.7.0"
name: "ai-frameworks"
version: "1.0.0"
description: "High-level AI and Agent Frameworks: LangGraph (graph-based multi-actor workflows), PydanticAI (type-safe agent framework), and smolagents (code-centric agents)"
category: "ai"
license: "MIT OR Apache-2.0"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "python3"
        - "python3-devel"
        - "gcc"
        - "make"
        - "tar"
        - "gzip"
        - "curl"
        - "openssl-devel"
    build_packages:
        - "python"

runtime:
    dependencies:
        - "python"

verification:
    command: "python3 -c \"import langgraph, pydantic_ai, smolagents; print('ai-frameworks ready')\""
    expected_output_contains: "ai-frameworks ready"
