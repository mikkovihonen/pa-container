schema_version: "0.7.0"
name: "language-servers/clangd"
version: "1.0.0"
description: "C/C++ language server providing code completions and indexing"
category: "devtools"
license: "Apache-2.0"

payload:
    type: "build_script"
    script: "build.sh"
    build_deps:
        - "clang-tools-extra"

runtime:
    dependencies:
        - "language-servers/base"

verification:
    command: "clangd --version"
    expected_output_contains: "clangd"
