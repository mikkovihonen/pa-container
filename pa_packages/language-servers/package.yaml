schema_version: "0.7.0"
name: "language-servers"
version: "1.0.0"
description: "Unified language server capability providing lsp-bridge core and language servers"
category: "devtools"
license: "Apache-2.0"

payload:
    type: "none"

skill:
    enabled: true
    source: "skill/base.md"
    target_agents: ["all"]

runtime:
    dependencies:
        - "language-servers/base"

verification:
    command: "lsp-bridge --version"
    expected_output_contains: "lsp-bridge 1.0.0"
