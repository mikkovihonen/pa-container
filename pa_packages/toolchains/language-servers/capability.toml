schema_version = "1.0"

[capability]
name = "language-servers"
category = "devtools"
version = "1.0.0"
description = "Unified language server capability providing lsp-bridge core and language servers (pyright, typescript-language-server, rust-analyzer, gopls)"
requires = ["languages"]

[staging]
install_prefix = "/opt/pa/packs/language-servers"
bin_dirs = ["bin"]
fedora_packages = ["rust-analyzer", "gopls"]
macos_brew_packages = ["rust-analyzer", "gopls"]

[entitlements]
read_paths = ["/opt/pa/packs/language-servers"]
write_paths = ["/tmp/pa-lsp"]
allow_gpu = false

[proxy]
allowlist = []
tokens = []
