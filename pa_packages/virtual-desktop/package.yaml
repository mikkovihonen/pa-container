schema_version: "0.7.0"
name: "virtual-desktop"
version: "2.1.0"
description: "Headless virtual desktop with agent-desktop automation CLI; selectable Wayland (labwc, wayvnc) and X11 (Xvfb, x11vnc) display backends with noVNC streaming"
category: "desktop"
license: "MIT"

config:
    resolution: "1920x1080"
    compositor: "labwc"
    open_browser: false
    vnc:
        enabled: true
        port: "auto"
        expose: "localhost"
    novnc:
        enabled: true
        port: "auto"
        expose: "localhost"
    gpu:
        enabled: "auto"

payload:
    type: build_script
    script: "build.sh"
    build_deps:
        - "novnc"
        - "python3-websockify"
        - "mesa-dri-drivers"
        - "dejavu-sans-fonts"
        - "liberation-sans-fonts"

features:
    required: true
    wayland:
        description: "Headless Wayland display stack: labwc compositor with Xwayland compatibility, wayvnc VNC server, and wlr-randr/grim/slurp/xdotool/wtype automation tooling"
        default: true
        payload:
            type: build_script
            script: "features/wayland/build.sh"
            build_deps:
                - "labwc"
                - "xorg-x11-server-Xwayland"
                - "wlr-randr"
                - "wayvnc"
                - "grim"
                - "slurp"
                - "xdotool"
                - "wtype"
                - "mesa-libEGL"
                - "mesa-libGLES"
                - "mesa-libgbm"
        runtime:
            env:
                DISPLAY: ":0"
                WAYLAND_DISPLAY: "wayland-0"
        skill_fragment: "skill/features/wayland.md"
        verification:
            command: "command -v labwc && command -v wayvnc && command -v Xwayland"
            expected_output_contains: "labwc"
    x11:
        description: "Headless X11 display stack: Xvfb display server, x11vnc VNC server, openbox window manager, and xdotool/wmctrl automation tooling"
        default: false
        payload:
            type: build_script
            script: "features/x11/build.sh"
            build_deps:
                - "xorg-x11-server-Xvfb"
                - "x11vnc"
                - "xdotool"
                - "wmctrl"
                - "openbox"
                - "ImageMagick"
        runtime:
            env:
                DISPLAY: ":0"
        skill_fragment: "skill/features/x11.md"
        verification:
            command: "command -v Xvfb && command -v x11vnc && command -v xdotool"
            expected_output_contains: "Xvfb"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

mcp:
    enabled: true
    server_id: "virtual-desktop"
    transport: "stdio"
    command: "/usr/local/bin/agent-desktop"
    args: ["mcp"]

runtime:
    dependencies:
        - "python"
    devices:
        - "/dev/dri"
    env:
        XDG_RUNTIME_DIR: "/run/user/1000"
        PA_CONTAINER_DESKTOP: "true"

extension:
    entrypoint: "host.plugin:VirtualDesktopPlugin"
    config_key: "desktop"
    commands:
        - name: "desktop"
          help: "Inspect active virtual desktop containers, noVNC web UIs, and VNC endpoints"
          handler: "host.desktop:handle_desktop_command"

verification:
    command: "agent-desktop status"
    expected_output_contains: "Virtual Desktop"
