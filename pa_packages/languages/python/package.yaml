schema_version: "0.7.0"
name: "languages/python"
version: "3.15.2"
description: "Fedora system Python 3.15 runtime with uv and pip"
category: "runtimes"
license: "PSF-2.0"
core: true

payload:
    type: distro_package
    packages:
        - "python3"
        - "python3-pip"
        - "python3-devel"
        - "uv"

skill:
    enabled: true
    source: "skill/SKILL.md"
    target_agents: ["all"]

runtime:
    env:
        UV_SYSTEM_CERTS: "1"

egress:
    allow_hosts:
        - "pypi.org"
        - "files.pythonhosted.org"

verification:
    command: "python3 --version"
    expected_output_contains: "Python 3.15"
