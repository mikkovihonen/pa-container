[project]
name = "pa-container"
version = "2.0.0"
description = "Next-Generation Multi-Agent Software Factory with MicroVM Isolation and Network Auditing"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
proxy = [
    "mitmproxy>=12.2.3",
    "pyyaml>=6.0.3",
]
docs = [
    "zensical>=0.0.57",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.6.1",
    "pymarkdownlnt>=0.9.34",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
default-groups = ["proxy", "docs", "dev"]
package = false
override-dependencies = [
    "msgpack>=1.2.1",
    "tornado>=6.5.7",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4"
]

[tool.pytest.ini_options]
testpaths = [
    "coding-agent-proxy/addons/allowlist/tests",
    "coding-agent-proxy/addons/token_replacer/tests",
    "coding-agent-proxy/addons/flow_export/tests",
    "coding-agent-proxy/addons/multi_agent_context/tests",
]
markers = [
    "smoke: proxy smoke tests",
    "integration: live proxy integration tests",
]

[tool.coverage.run]
branch = true
source = [
    "coding-agent-proxy/addons/allowlist",
    "coding-agent-proxy/addons/token_replacer",
    "coding-agent-proxy/addons/flow_export",
    "coding-agent-proxy/addons/multi_agent_context",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["coding-agent-proxy/addons", "scripts"]
include = [
    "coding-agent-proxy/**/*.py",
    "scripts/**/*.py",
    ".github/**/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E402",  # module level import not at top (intentional: sys.dont_write_bytecode)
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = [
    "allowlist", "token_replacer", "flow_export", "multi_agent_context",
]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["coding-agent-proxy/addons"]
explicit_package_bases = true
files = [
    "coding-agent-proxy/addons",
    "scripts",
    ".github/workflows/scripts",
]
exclude = [
    "^(.*/)?tests/.*$",
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
ignore_errors = true
