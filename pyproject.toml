[project]
name = "pa-container"
version = "0.7.0"
description = "Containerized environment for running the pi-coding-agent with local LLM inference"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "keyring>=24.0.0",
    "rich>=13.9.0",
]

[project.scripts]
pa = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
proxy = [
    "mitmproxy>=12.2.3",
]
src = [
    "huggingface_hub>=1.26.0",
]
docs = [
    "zensical>=0.0.57",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.6.1",
    "pymarkdownlnt>=0.9.34",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
default-groups = ["src", "proxy", "dev"]
package = true
override-dependencies = [
    "msgpack>=1.2.1",
    "tornado>=6.5.7",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4"
]

[tool.pytest.ini_options]
testpaths = [
    "src/tests",
    "coding-agent-proxy/addons/allowlist/tests",
    "coding-agent-proxy/addons/token_replacer/tests",
    "coding-agent-proxy/addons/flow_export/tests",
    "packages",
]
markers = [
    "smoke: package smoke tests",
    "integration: live container integration tests",
]

[tool.coverage.run]
branch = true
source = [
    "src",
    "coding-agent-proxy/addons/allowlist",
    "coding-agent-proxy/addons/token_replacer",
    "coding-agent-proxy/addons/flow_export",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
include = [
    "src/**/*.py",
    "coding-agent-proxy/addons/allowlist/**/*.py",
    "coding-agent-proxy/addons/token_replacer/**/*.py",
    "packages/**/*.py",
    "scripts/**/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E402",  # module level import not at top (intentional: sys.dont_write_bytecode)
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = [
    "util", "config", "runtimes", "models", "server", "network", "secret_store",
    "allowlist", "token_replacer",  # coding-agent-proxy/addons
]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["src", "coding-agent-proxy/addons"]
explicit_package_bases = true
files = [
    "src",
    "coding-agent-proxy/addons",
    "scripts",
    ".github/workflows/scripts",
]
exclude = [
    "^(.*/)?tests/.*$",
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pa_packages.*",
]
ignore_missing_imports = true

